name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Core, render, hardware and packaging checks
        run: scripts/check.sh

  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and package
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "f5c3654a1c2d2a01f7f67def7a0dc48e691f63c0"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build
          idf.py -B build-demo -DPIPKIN_DEMO=ON build
          for build in build-es3c40p build-es3c40p-demo; do
            demo=OFF
            if [[ "$build" == *-demo ]]; then demo=ON; fi
            idf.py -B "$build" -DIDF_TARGET=esp32s3 -DSDKCONFIG="$build/sdkconfig" -DPIPKIN_DEMO=$demo build
          done
          tag=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag=(--tag "$GITHUB_REF_NAME"); fi
          python3 -B scripts/package_firmware.py "${tag[@]}" --build-dir build --build-dir build-es3c40p \
            --demo-build-dir build-demo --demo-build-dir build-es3c40p-demo --output-dir dist
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firmware
          path: dist/
      - name: Verify assets
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/firmware-release.md" <<'NOTES'
          Prebuilt firmware for two boards:

          - 2.8-inch ESP32-2432S028R "Cheap Yellow Display" (ESP32, 4 MB flash,
            ILI9341-compatible LCD, XPT2046-compatible resistive touch):
            firmware.json and its images.
          - 4-inch LCDWIKI ES3C40P (ESP32-S3, 16 MB flash, ST7796S IPS LCD, FT6336U
            capacitive touch): firmware-es3c40p.json and its -es3c40p images.

          Pipkin CLI 2.x installs the CYD firmware with `pipkin flash`; the 4-inch
          board needs CLI 2.1 or later. Both can also be built and flashed with
          ESP-IDF as described in docs/development.md.

          Keep LICENSE, NOTICE.md, Inter-OFL.txt and third-party-notices.txt with
          redistributed firmware. SHA256SUMS covers every supplied asset.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft \
            --title "Pipkin firmware $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/firmware-release.md"
