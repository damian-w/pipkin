name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Core, render and hardware checks
        run: |
          flags="-std=c++17 -Wall -Wextra -Werror -Iinclude"
          c++ $flags src/model.cpp src/protocol.cpp tests/core_test.cpp -o core && ./core
          c++ $flags src/model.cpp src/render.cpp tests/render_check.cpp -o render && ./render
          c++ $flags -Imain tests/hardware_check.cpp -o hardware && ./hardware

  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build
