name: Release firmware

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check
        shell: bash
        run: |
          flags="-std=c++17 -Wall -Wextra -Werror -Iinclude"
          c++ $flags src/model.cpp src/protocol.cpp tests/core_test.cpp -o core && ./core
          c++ $flags src/model.cpp src/render.cpp tests/render_check.cpp -o render && ./render
          c++ $flags -Imain tests/hardware_check.cpp -o hardware && ./hardware
          python3 -B -m unittest discover -s tests -p '*_test.py'
      - name: Build and package
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "f5c3654a1c2d2a01f7f67def7a0dc48e691f63c0"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build
          python3 -B scripts/package_firmware.py --tag "$GITHUB_REF_NAME" \
            --source-revision "$GITHUB_SHA" --output-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware
          path: dist/
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: firmware
          path: dist/
      - name: Verify assets
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/firmware-release.md" <<'NOTES'
          Prebuilt firmware for the qualified ESP32-2432S028R board profile
          (ESP32, 4 MB flash, ILI9341-compatible LCD and XPT2046-compatible
          resistive touch). Tested physical variants are recorded in boards/profiles.json.

          Hardware qualification is still required before publishing this draft.
          Check first installation, update from the initial firmware, touch/display
          behaviour, saved page preference, USB reset and interrupted-flash recovery
          on the supported board.

          Once published, Pipkin CLI 1.4.0 or later can install this release with
          `pipkin flash`. Firmware can also be built and flashed with ESP-IDF as
          described in docs/development.md. The separate images preserve the
          initial partition layout; there is no automatic application rollback.

          Keep LICENSE, NOTICE.md, Inter-OFL.txt and third-party-notices.txt with
          redistributed firmware. SHA256SUMS covers every supplied asset.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft \
            --title "Pipkin firmware $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/firmware-release.md"
